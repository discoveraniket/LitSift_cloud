<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89dceb" />
      <stop offset="35%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#cba6f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#89b4fa" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#313244" stroke-width="4" />
  
  <!-- Subtle Inner Glow Radial -->
  <circle cx="64" cy="64" r="46" fill="url(#glowGrad)" />

  <!-- LitSift Lightning / Sift Bolt Icon -->
  <path
    d="M69 16 L29 70 L62 70 L55 112 L99 58 L66 58 Z"
    fill="url(#boltGrad)"
    filter="url(#shadow)"
    stroke="#cdd6f4"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
</svg>
